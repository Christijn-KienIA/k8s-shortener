# Traefik (zit standaard in k3s) stuurt inkomend verkeer op poort 80 hierheen.
# Geen host opgegeven = luistert op elk adres, dus gewoon http://<ip-van-je-vps>/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortener
  namespace: shortener
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
