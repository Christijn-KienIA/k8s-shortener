# De API is stateless: elke pod is inwisselbaar, ze delen de database.
# Daarom een Deployment (wegwerp-pods) in plaats van een StatefulSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 1 extra pod tijdens een update
      maxUnavailable: 0    # nooit minder dan 2 werkende pods -> geen downtime
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/christijn-kienia/k8s-shortener:latest
          ports:
            - containerPort: 8000
          env:
            # De pod leest zijn eigen naam uit -> zichtbaar onderaan de pagina
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: shortener
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
          livenessProbe:            # kapot? -> pod herstarten
            httpGet: { path: /livez, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:           # nog niet klaar? -> geen verkeer sturen
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }   # HPA rekent hiermee
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shortener
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
